# cargo-deny policy (`make deny`, or `cargo deny --locked check`); CI runs it on
# every pull request. https://embarkstudios.github.io/cargo-deny/

[graph]
# The platforms joust ships for; dependencies of other platforms are ignored.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# Vulnerabilities and yanked crates fail. Unmaintained crates fail only when
# joust depends on them directly: deep in Lance's, DataFusion's or iced's trees
# there is nothing joust can do about them.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# joust is MIT-licensed; these are the licenses in its dependency tree.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# A tree this size (Lance, DataFusion, iced) has many duplicate versions that
# joust can't unify, so they're allowed.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
