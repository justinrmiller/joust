[package]
name = "joust"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "A desktop SQL workbench for LanceDB"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
# Decodes Function source code sent by LanceDB Enterprise.
base64 = "0.22"
dirs = "7"
futures = "0.3"
iced = { version = "0.14", features = ["tokio", "canvas", "advanced", "image-without-codecs"] }
# Decodes media for previews, thumbnails and colour vectors. Only these codecs
# are compiled in (iced's own `image` feature would pull in every format,
# including a heavy AVIF encoder); iced's renderer shares this dependency.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# LanceDB re-exports the exact arrow + datafusion versions it links against
# (`lancedb::arrow::*`, `lancedb::datafusion`), so joust uses those instead of
# declaring its own and risking a version split.
# `remote` adds the LanceDB Enterprise / Cloud client (`db://` connections,
# server-side SQL over Flight, Functions, jobs and OAuth sign-in).
lancedb = { version = "0.41", features = ["remote"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Names the `lancedb` CLI's per-profile OAuth session folders, so a CLI
# sign-in can be reused.
sha2 = "0.10"
# Spills in-memory videos to disk so ffmpeg can seek in them.
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
# Reads the `lancedb` CLI's connection profiles (~/.lancedb/config.toml).
toml = "1"

[dev-dependencies]
# Headless rendering and simulated input for view tests.
iced_test = "0.14"
